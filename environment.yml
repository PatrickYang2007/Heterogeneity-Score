name: heterogeneityScore
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
dependencies:
  - python=3.8.20
  # GPU-enabled PyTorch stack (CUDA 12.1 build)
  - pytorch=2.4.1
  - pytorch-cuda=12.1
  - torchvision=0.20.0
  - torchaudio=2.4.1
  # scientific stack
  - numpy=1.24.4
  - pandas=2.0.3
  - scipy=1.10.1
  - matplotlib=3.7.3
  # genomics
  - pyfaidx=0.9.0.4
  - macs2=2.2.9.1
  # testing
  - pytest=8.3.5
  # attribution (src/attribute.py). Not on the conda channels above for this
  # python/torch pin, so it comes from pip. Note that 0.7.0 has no DeepLIFT rule
  # for GELU -- src/attribute.py patches one in; see docs/FINDINGS.md §7.
  - pip
  - pip:
      - captum==0.7.0
